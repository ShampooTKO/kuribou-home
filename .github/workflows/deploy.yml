name: Deploy to Sakura (FTPS)

# main ブランチに push すると、public/ の中身がさくらへ自動アップロードされます。
# Actions タブの「Run workflow」から手動実行もできます。
# ※ 現在は GitHub Pages で公開しているため、自動実行は止めています。
#    さくらへ切り替える場合は Actions タブから手動実行するか、
#    下の push トリガーのコメントを外してください。
on:
  workflow_dispatch:
  # push:
  #   branches: [main]

concurrency:
  group: deploy-sakura
  cancel-in-progress: false

jobs:
  deploy:
    name: さくらへアップロード
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: FTPS でアップロード
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./public/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          # サーバー側にあってリポジトリにないものを消さないための除外設定
          exclude: |
            **/.git*
            **/.git*/**
            **/.DS_Store
            **/node_modules/**
