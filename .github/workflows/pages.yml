name: Deploy to GitHub Pages

# main に push すると public/ の中身が GitHub Pages として公開されます。
# 初回のみ、リポジトリの Settings → Pages → Source を
# 「GitHub Actions」に変更してください。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Pages へ公開
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pages の設定を読み込み
        uses: actions/configure-pages@v5

      - name: public/ をアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: 公開
        id: deployment
        uses: actions/deploy-pages@v4
