name: Deploy to GitHub Pages

# main に push すると public/ の中身が GitHub Pages として公開されます。
# Pages が未設定の場合は configure-pages の enablement: true が
# 自動で有効化するため、Settings での手動操作は不要です。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Pages へ公開
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pages を有効化して設定を読み込み
        uses: actions/configure-pages@v5
        with:
          # リポジトリで Pages が未設定でも、ここで自動的に有効化する
          enablement: true

      - name: public/ をアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: 公開
        id: deployment
        uses: actions/deploy-pages@v4
